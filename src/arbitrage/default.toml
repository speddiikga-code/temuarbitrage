keywords = [
  "전자담배", "담배", "라이터", "레이저", "권총", "장총", "모의총", "비비탄", "bb탄", "에어소프트", "석궁", "삼단봉",
  "전기충격기", "후추스프레이", "수갑", "대마", "마약", "도검", "너클",
  "e-cigarette", "e-cig", "vape", "vaping", "cigarette", "cigarette lighter", "gas lighter", "arc lighter",
  "torch lighter", "laser", "gun", "airsoft", "taser", "stun gun", "pepper spray", "handcuffs", "crossbow",
