action = "drop"
keywords = [
  "식품", "과자", "사탕", "젤리", "커피", "영양제", "비타민", "프로틴", "건강기능식품", "홍삼", "간식", "라면",
  "snack", "candy", "gummy", "gummies", "coffee", "supplement", "supplements", "vitamin", "vitamins",
  "protein powder", "food",
]
unless = [
  "펫", "강아지", "고양이", "반려", "pet", "dog", "cat", "식품용", "식품등급", "food grade", "food-grade",
  "머신", "메이커", "그라인더", "드리퍼", "필터", "컵", "머그", "텀블러", "포트", "용기", "보관", "밀폐", "저울", "슬라이서",
  "maker", "machine", "grinder", "dripper", "filter", "cup", "mug", "tumbler", "pot", "scoop", "container",
  "storage", "bag", "wrap", "sealer", "scale", "processor", "slicer", "chopper", "dehydrator", "warmer", "tray", "clip",
]

[compliance.cosmetics]
