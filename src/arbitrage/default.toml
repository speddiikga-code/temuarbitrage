[compliance.medical]
reason = "의료기기법: medical device, import licence required"
action = "drop"
keywords = [
  "의료기기", "체온계", "혈압계", "혈당", "콘택트렌즈", "컬러렌즈", "보청기", "임신테스트", "콘돔", "kf94", "kf80",
  "덴탈마스크", "의료용", "치아교정", "thermometer", "blood pressure", "glucose", "contact lens", "contact lenses",
  "hearing aid", "pregnancy test", "condom", "surgical mask", "medical", "orthodontic", "teeth whitening",
]
