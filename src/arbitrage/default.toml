  "워키토키", "gps", "트래커", "rfid", "nfc", "지그비", "2.4g", "2.4ghz", "lte",
  "bluetooth", "wireless", "cordless", "remote control", "drone", "smartwatch", "smart watch", "walkie",
  "tracker", "zigbee", "lora", "rc car", "rc",
]

[compliance.children]
reason = "어린이제품 안전특별법: children's product, needs KC 어린이제품 certification"
action = "flag"
keywords = [
  "유아", "아동", "어린이", "키즈", "아기", "신생아", "영유아", "장난감", "완구", "피규어", "인형", "젖병",
  "쪽쪽이", "유모차", "카시트", "물놀이", "학용품", "초등",
  "kids", "kid", "children", "child", "baby", "toddler", "infant", "toy", "toys", "doll", "plush",
  "pacifier", "stroller", "car seat", "montessori",
]
unless = ["아기자기", "펫", "강아지", "고양이", "반려", "pet", "dog", "cat", "adult", "성인", "child lock", "childproof", "child-proof"]

[compliance.food]
