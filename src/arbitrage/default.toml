  "화장품", "스킨케어", "로션", "크림", "세럼", "앰플", "마스크팩", "립스틱", "틴트", "파운데이션", "향수",
  "샴푸", "염색약", "선크림", "미백", "cosmetic", "cosmetics", "skincare", "skin care", "serum", "lotion",
  "lipstick", "lip tint", "foundation", "perfume", "shampoo", "hair dye", "sunscreen", "makeup", "whitening",
]
