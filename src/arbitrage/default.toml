# Defaults. Override any key with `--config my.toml` using the same layout.

[fx]
# Fallback KRW per 1 unit of currency, used only when live rates can't be fetched.
KRW = 1
USD = 1365
CNY = 202

[policy]
ad_rate = 0.10         # share of the sale price spent on ads
returns_rate = 0.03    # reserve for returns and cancellations
target_margin = 0.15   # net margin a product must clear to count as an opportunity
fx_buffer = 0.03       # cushion on foreign-currency costs
undercut = 0.0         # list this fraction below the lowest matched competitor
duty_free_usd = 150    # China -> Korea personal-use limit (US goods: 200)
tariff_rate = 0.08     # applied only above the limit
import_vat_rate = 0.10

# fee_rate = everything the marketplace keeps, as a share of the sale price.
[marketplaces.naver]
# 판매수수료 3% (Naver Shopping inflow) + Naver Pay 주문관리수수료 up to 3.63%. Check your seller grade.
fee_rate = 0.0663

[marketplaces.coupang]
# Category commission (commonly 10.8%) + 10% VAT on the fee. Check your category.
fee_rate = 0.1188

[sources.aliexpress]
# The affiliate API does not return shipping; many Choice items ship free to Korea.
default_shipping_krw = 0

[matching]
threshold = 0.55
image_max_distance = 10
# CSV of extra English,Korean product terms (see README "English supplier titles"); "" = built-in glossary only.
glossary_path = ""

# Compliance: keyword rules that flag products Korea restricts. A keyword filter, not legal advice:
# it names the likely requirement so you check before listing. `action` is "flag" (keep, show the
# reason) or "drop" (leave the product out of the scan). `mode = "drop"` would force every rule to
# drop; `enabled = false` turns the filter off. Korean keywords match as substrings, Latin ones as
# whole words (write `~mah` for a substring). `requires_any` / `unless` narrow a rule.
[compliance]
enabled = true

[compliance.kc_safety_cert]
reason = "KC 안전인증 (전기용품안전관리법): mains-powered, needs certification before import"
action = "flag"
keywords = [
  "전기장판", "전기요", "전기매트", "온수매트", "전기히터", "온풍기", "전기난로", "전기주전자", "전기포트",
  "전기밥솥", "전기그릴", "전기냄비", "에어프라이어", "헤어드라이어", "드라이기", "고데기", "매직기",
  "어댑터", "아답터", "멀티탭", "콘센트", "연장선", "전선", "220v",
  "electric blanket", "heating pad", "electric kettle", "rice cooker", "air fryer", "hair dryer",
  "curling iron", "straightener", "space heater", "power strip", "power adapter", "ac adapter", "wall adapter",
  "extension cord",
]

[compliance.kc_safety_confirm]
reason = "KC 안전확인 (전기용품안전관리법): declared before import"
action = "flag"
keywords = [
  "충전기", "고속충전", "무선충전", "가습기", "공기청정기", "선풍기", "서큘레이터", "전기면도기", "전동면도기",
  "전동칫솔", "안마기", "마사지기", "led등", "led 등", "led스탠드", "led 스탠드", "전기스탠드", "조명", "램프", "무드등", "전기모기채",
  "charger", "humidifier", "air purifier", "electric fan", "shaver", "electric toothbrush", "massager",
  "led light", "led lamp", "lamp", "night light", "desk light",
]
unless = ["shade", "전등갓", "램프갓"]

[compliance.kc_supplier]
reason = "KC 공급자적합성확인: small electrical/IT goods, self-declared before import"
action = "flag"
keywords = [
  "usb", "허브", "키보드", "마우스", "이어폰", "헤드폰", "헤드셋", "스피커", "마이크", "웹캠", "모니터",
  "hub", "keyboard", "mouse", "earphone", "earphones", "earbuds", "headphone", "headphones", "headset",
  "speaker", "microphone", "webcam", "monitor",
]
unless = ["마우스패드", "마우스 패드", "장패드", "mouse pad", "mousepad", "케이블", "cable", "거치대", "스탠드", "stand", "holder"]

[compliance.radio]
reason = "전파법 적합성평가: radio/Bluetooth/Wi-Fi device needs KC 전파 certification"
