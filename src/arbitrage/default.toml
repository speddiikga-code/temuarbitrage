[compliance.batteries]
reason = "lithium battery: KC 안전확인 and dangerous-goods shipping rules"
action = "flag"
keywords = ["리튬", "배터리", "보조배터리", "건전지", "충전식", "battery", "batteries", "power bank", "powerbank", "lithium", "li-ion", "18650", "~mah"]

[compliance.restricted]
reason = "restricted or prohibited import (weapons, tobacco, lasers, drugs)"
