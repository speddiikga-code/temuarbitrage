# Brands with active counterfeit enforcement or exclusive Korean distributors. Selling them from a
# supplier that isn't the brand is an IP risk. Edit this list for your own categories.
[compliance.brands]
action = "flag"
blocklist = [
  "nike", "adidas", "apple", "iphone", "airpods", "samsung", "galaxy", "sony", "dyson", "lego", "disney",
  "gucci", "chanel", "louis vuitton", "supreme", "new balance", "north face", "stanley", "pokemon", "pokémon",
