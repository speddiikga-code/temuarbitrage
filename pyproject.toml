[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitrage"
version = "0.1.0"
description = "Find the same product at different prices across marketplaces and estimate resale profit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
images = ["Pillow>=10"]
# Operating core on PostgreSQL (SQLite needs nothing extra).
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "Pillow>=10", "psycopg[binary]>=3.1"]

[project.scripts]
arbitrage = "arbitrage.cli:main"
arbitrage-ops = "arbitrage.ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arbitrage = ["default.toml", "ops/schema.sql", "ops/charters.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
