[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitrage"
version = "0.1.0"
description = "Find the same product at different prices across marketplaces and estimate resale profit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
images = ["Pillow>=10"]
dev = ["pytest>=8", "Pillow>=10"]

[project.scripts]
arbitrage = "arbitrage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arbitrage = ["default.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
