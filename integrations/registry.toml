region_ok_for_korea = true
eligibility = "Korean 사업자 only (개인사업자 or 법인): 사업자등록증, 통장사본, 통신판매업신고증 (can be uploaded later; since 2026-06 not required from 간이과세자, whose prior-year supply is under ₩104,000,000). No individual (비사업자) path. Opening fee ₩0."
commercial_terms = "Category commission 4-10.9% of the paid price (official table: 가전디지털 7.8%, 뷰티 9.6%, 패션 10.5%, 가구/도서 10.8%, 쥬얼리 4%) plus 10% VAT on the commission; ₩55,000 (VAT incl.) service fee in any month with sales of ₩1,000,000 or more (₩5,000,000 for 가전/디지털, reported). Settlement on 구매확정 (auto 7 days after delivery): 주정산 pays 70% about 15 business days after the week ends and 30% later; 월정산 pays 100% about 15 business days after month end; 빠른정산 (90% next day) offered to some 개인사업자 only. Overseas purchase listings: product deliveryMethod AGENT_BUY with pccNeeded = true; Coupang collects the buyer's 개인통관고유부호 and returns it in the order sheet. KC-required goods without certification cannot be listed; children's products, food, cosmetics and medical devices have their own gates."
integration = "api"
credentials = ["COUPANG_VENDOR_ID", "COUPANG_ACCESS_KEY", "COUPANG_SECRET_KEY"]
permissions = "Open API key issued in WING to a business-verified selling account; no approval process. One key per vendor. Self-development mode allows up to 10 registered IPs, settings changed at most 10 times a week; keys expire after 180 days. No sandbox; tests run against the live account. A Korean IP is not documented as required; a fixed IP is."
rate_limits = "Per-vendor per-second limit, unpublished and changeable without notice (HTTP 429 on breach); 20 or more error responses within 5 seconds triggers a temporary block."
supported_operations = ["create/update products (AGENT_BUY delivery method, certifications per item)", "list orders by minute/day and read one order sheet incl. personalCustomsClearanceCode", "confirm order, upload waybill with courier code (EMS, DHL, FEDEX, UPS, CAINIAO, CJGLS ...)", "returns and exchanges", "promotions and coupons", "customer inquiries", "settlement (sales and payout history)", "Rocket Growth inbound"]
manual_dependency = "Business registration and 통신판매업 신고; WING signup and document upload; enabling 해외상품 배송 in 판매정보; API key and IP registration every 180 days; choosing 주정산/월정산; KC evidence and 인증정보 per listing; placing the supplier order with the buyer's customs code outside Coupang; seller-score monitoring in WING; return-fee disclosure text on each listing."
