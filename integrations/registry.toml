[[integrations]]
id = "naver_smartstore"
name = "Naver Smart Store (seller center + Commerce API)"
roles = ["sales_channel"]
verdict = "go"
status = "not_connected"
connected = false
region_ok_for_korea = true
eligibility = "Overseas-product selling rights (해외상품판매권한), which unlock an overseas 출고지, the 해외 icon, 개인통관고유부호 collection and the 구매대행 (수입식품/화장품) categories, are granted to 국내사업자 only since 2026-06-24; a 국내 개인 seller cannot obtain them. So: 사업자등록증 (and 통신판매업 신고번호 once past 50 구매확정 or when not 간이과세자), 통장사본, 3 business days review, no opening fee stated. Food and cosmetics categories additionally need the 식약처 영업신고/등록 uploaded."
commercial_terms = "Fees from payments on or after 2025-06-02: 판매수수료 3% (2.73% + VAT) on the product amount, or 판매자 마케팅 수수료 1% when the buyer came through the seller's own link or Naver ads; plus Npay 주문관리 수수료 by 국세청 grade from 2025-10-01: 영세 1.947%, 중소 2.563-3.003%, 일반 3.630% (VAT incl.), charged on product and shipping amounts; a new business starts at 일반, so about 6.63% total. Payout 1 business day after the order ends (구매확정, auto about 8 days after delivery); 빠른정산 excludes overseas-shipped items. Listing rules for overseas goods: 출고지 set to an overseas address, '해외' prefix in the product name, order form forces the buyer's 개인통관고유부호 (shown in the seller center and API until the order ends, then deleted). 발송기한 3 business days after payment with one 발송지연 extension up to 90 days; no tracking event within 15 business days on an overseas 출고지 counts as a false waybill (3 penalty points); KC, 어린이제품, 의료기기, 식품, 화장품 gates apply."
integration = "api"
credentials = ["NAVER_COMMERCE_CLIENT_ID", "NAVER_COMMERCE_CLIENT_SECRET"]
permissions = "커머스API센터 account for the store's 통합매니저 (국내 개인 or 사업자; 해외판매자 excluded); one '내스토어 애플리케이션' per store, immediate registration, mandatory IPv4 whitelist since 2024-09-11, e-mail re-authentication every 180 days or the app goes dormant and the secret rotates. OAuth2 client-credentials: client_secret_sign = base64(bcrypt(client_id + '_' + timestamp, client_secret)), type SELF, token valid 3 hours. No sandbox; tokens need a real, actively selling store."
rate_limits = "Token bucket per API per application (429 GW.RATE_LIMIT with GNCP-GW-RateLimit-* headers); default about 2 requests/second per API for store apps (Naver staff answer on the official discussion board), limits described as 'fluid, no exceptions'."
supported_operations = ["products: create/update/delete/bulk update, categories, attributes, origin, 상품정보제공고시", "orders: changed-order polling, product-order query (returns individualCustomUniqueCode), 발주 확인, 발송 처리 with carrier code (CH1 기타택배 for overseas), 발송지연 처리", "claims: cancel, return (approve/hold/reject), exchange", "settlement: daily and per-order settlement, fee and VAT statements", "customer and product inquiries", "seller address book, 오늘출발, N배송"]
manual_dependency = "Business registration and mail-order filing; seller signup, document upload and review; 해외상품판매 terms consent and category rights; overseas 출고지/반품지 setup; API app creation with IP registration and 180-day re-auth; capturing the customs code before order end; per-SKU certification entries; physical returns and 환불보류 fee claims; penalty appeals by e-mail; no webhooks, so orders are polled."
health = "unverified"
last_verified = "2026-09-27"
sources = [
