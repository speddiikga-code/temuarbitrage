[[integrations]]
id = "aliexpress_supplier"
name = "AliExpress (buyer account + Dropshipping Center + Open Platform DS API)"
roles = ["supplier"]
verdict = "go"
status = "not_connected"
connected = false
region_ok_for_korea = true
eligibility = "Any buyer account; dropshipping is officially supported: activate the DS Center and accept the AliExpress Business Program agreement (2024-02-01), then a 'Dropshipping Developer (Individual/Corporation)' app on the Open Platform, OAuth-authorized against that buyer account. Korean individuals qualify; the Commercial (ISV) and Seller-inhouse categories are closed to non-Chinese companies."
commercial_terms = "Terms of Use (updated 2026-08-26, effective 2026-09-26) do not restrict reselling purchased goods or shipping to a third-party address; they forbid copying or systematically retrieving site content by robots or by hand (3.2(a)), so all product data must come through the API. The Beginner's Guide for Dropshipping (2025-01-13) says AliExpress supports dropshipping to 'any other eCommerce platform'. The reseller is the AliExpress buyer of record and holds the dispute rights (Buyer Protection: 15 days after receipt; Korean 90-day refund policy tightened 2025-06 to 1-5 free returns a month). Each order must carry the Korean recipient's 개인통관고유부호; there is no documented Korea-specific field in ds.order.create, so a test order is required. Data pulled through the API may be used only inside the approved app (API Use Agreement 7.5.4)."
integration = "api"
credentials = ["ALIEXPRESS_DS_APP_KEY", "ALIEXPRESS_DS_APP_SECRET", "ALIEXPRESS_DS_ACCESS_TOKEN", "ALIEXPRESS_DS_REFRESH_TOKEN"]
permissions = "AE-Dropshipper API group (16 methods) with a buyer access token: ds.product.get (buyer price, ship_to_country=KR, target_language ko_KR), ds.freight.query and logistics.buyer.freight.calculate (shipping cost and days per line), ds.order.create (address, items, logistics_service_name; payment by API only after DS auth plus a PayPal binding), ds.order.tracking.get, trade.ds.order.get, ds.text.search, ds.image.searchV2, category and feed methods (feeds and category_sequence need a whitelist). One Open Platform account may hold either the DS API or the Affiliate API, not both (doc 1935, 2025-06-13)."
rate_limits = "No daily quota documented. Product doc notes an overall 500 QPS for the connection with a 1-2% error rate; third parties report a 5,000 'flow rate' shown in the console. Access token 30 days, refresh token 30 days, refresh chain at most 60 days, then a human re-authorizes."
supported_operations = ["product detail and buyer price", "shipping cost and delivery days per product and line", "text and image search", "create order for a third-party address", "order status and tracking"]
manual_dependency = "DS Center activation and agreement; developer profile review and app approval with a written reason (1-2 business days reported); OAuth re-authorization at most every 60 days; PayPal binding for API payment, otherwise each order is paid by hand in the app (cards, Naver Pay, Kakao Pay, Toss Pay); customer's 개인통관고유부호, name and phone copied into each order; disputes and returns in the app."
health = "unverified"
last_verified = "2026-09-27"
sources = [
