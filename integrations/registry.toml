credentials = ["ANTHROPIC_API_KEY"]
permissions = "Messages API, Message Batches, prompt caching, inference_geo, workspaces with per-key spend limits. Anthropic runs real-time safeguards on inputs and outputs; the customer must warn, throttle or suspend violating end users (help center) and keep keys server-side (\"Never share your API key\")."
